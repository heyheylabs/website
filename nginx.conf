# nginx for heyheylabs.com.au on Asimov (HHL-WEB-4). Static files only, baked into the image; no proxying.
# Runs as uid 101 on a read-only root filesystem: every path nginx writes is under /tmp, which the Pod mounts as an
# emptyDir. The Gateway terminates TLS and health-checks `/` on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No client address in the log: behind the load balancer it is the proxy's anyway, and the site holds no
    # personal data. Status, path and timing are what an operator needs.
    log_format site '$time_iso8601 $request_method "$request_uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout site;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # index.html revalidates on every load (ETag, nginx's default) so a release shows at once; assets cache an hour.
    map $uri $cache_control {
        default "no-cache";
        ~\.(css|js|svg)$ "public, max-age=3600";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # One place for headers: a location with its own add_header would drop all of these.
        # Cache-Control has no `always`, so a 404 is never cached.
        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # The two hash lists are written by scripts/csp.py from docs/index.html and checked in CI; never edit them by hand.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-KzXLjTCkc8/czgGFZxUwzO0S3iS2Bemg/OVEqucnFMI='; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-hashes' 'sha256-7tsmGaw+rilRAyeDpgSgI1BtB1Cj9tGH8tjHKYTiDaE=' 'sha256-X73gtGZHAJISlpC4Yhx7lwJym1G70/vO9qWXQ/F7MgE=' 'sha256-jAEVI1vsErv3Nk9aF8NsR8MUwMkxTeB4kpd7ZV5pWOQ=' 'sha256-oDk24Rcu86DDPXpWfspgcZ1N7ALiqIq4Ger05X9wmv8=' 'sha256-xZSDK+E/Yc2Iw60lPjtM3pErtHr9UwmYtRFgIZaXlXA='; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
